[package]
name = "dcb-runtime-host"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
deadpool-postgres = { version = "0.14.2", optional = true }
jsonschema = "0.58.6"
serde_json = "1.0.154"
tephra-client = { version = "0.5.2", features = ["async"], optional = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-postgres = { version = "0.7.18", optional = true }
umadb-client = { version = "0.7.8", optional = true }
umadb-dcb = { version = "0.7.8", optional = true }
wasmtime = { version = "44.0.3", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }

[features]
default = ["umadb", "tephra", "postgres"]
umadb = ["dep:umadb-client", "dep:umadb-dcb"]
tephra = ["dep:tephra-client"]
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
