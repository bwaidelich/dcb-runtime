[package]
name = "dcb-runtime-host"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
jsonschema = "0.58.6"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "signal"] }
umadb-client = "0.7.8"
umadb-dcb = "0.7.8"
wasmtime = { version = "44.0.3", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
